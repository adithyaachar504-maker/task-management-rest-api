<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartTask – Task Management & Productivity Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #334155;
      --bg-input: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #475569;
      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
      --accent-info: #3b82f6;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Header & Navigation */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-primary), #818cf8);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .logo-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--accent-primary);
      color: white;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      background-color: var(--accent-primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-success {
      background-color: var(--accent-success);
      color: white;
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--accent-danger);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .btn-danger:hover {
      background-color: var(--accent-danger);
      color: white;
    }

    /* App Container */
    .main-container {
      max-width: 1280px;
      margin: 28px auto 0 auto;
      padding: 0 24px;
    }

    /* Dashboard Stats Section */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }

    .stat-card.total::before { background-color: var(--accent-primary); }
    .stat-card.completed::before { background-color: var(--accent-success); }
    .stat-card.pending::before { background-color: var(--accent-warning); }
    .stat-card.in-progress::before { background-color: var(--accent-info); }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      margin-top: 8px;
    }

    .progress-bar-bg {
      background-color: var(--bg-input);
      border-radius: 999px;
      height: 6px;
      width: 100%;
      margin-top: 12px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-success));
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Breakdown Summaries Grid */
    .summary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    @media (max-width: 768px) {
      .summary-row {
        grid-template-columns: 1fr;
      }
    }

    .summary-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px;
    }

    .summary-card h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill-item {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-count {
      background-color: var(--bg-card);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--accent-primary);
    }

    /* View Controls & Filters Toolbar */
    .controls-panel {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tabs-row {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background-color: var(--bg-card);
    }

    .tab-btn.active {
      color: white;
      background-color: var(--accent-primary);
    }

    .badge-count {
      background-color: rgba(255, 255, 255, 0.2);
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
    }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
    }

    .search-input:focus {
      outline: 2px solid var(--accent-primary);
    }

    .filter-select {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }

    .filter-select:focus {
      outline: 2px solid var(--accent-primary);
    }

    /* Tasks List Grid */
    .tasks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .task-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .task-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .task-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-main);
    }

    .task-title.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .tag-priority-high { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .tag-priority-medium { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .tag-priority-low { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }

    .tag-category { background-color: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); }

    .tag-status-pending { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .tag-status-in_progress { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .tag-status-completed { background-color: rgba(16, 185, 129, 0.15); color: #34d399; }

    .task-description {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .task-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
    }

    .task-due {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }

    .task-due.overdue {
      color: var(--accent-danger);
      font-weight: 700;
    }

    .task-actions {
      display: flex;
      gap: 6px;
    }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background-color: var(--bg-surface);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
    }

    .empty-state h4 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Pagination */
    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 20px;
    }

    .pagination-info {
      font-size: 14px;
      color: var(--text-muted);
    }

    .pagination-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Dialog Modal */
    dialog {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
      max-width: 500px;
      width: 90%;
      margin: auto;
      box-shadow: var(--shadow-lg);
    }

    dialog::backdrop {
      background-color: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
    }

    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .dialog-title {
      font-size: 18px;
      font-weight: 700;
    }

    .dialog-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
    }

    .form-control:focus {
      outline: 2px solid var(--accent-primary);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .error-banner {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--accent-danger);
      color: #f87171;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Header Banner -->
  <header>
    <div class="header-container">
      <div class="logo-group">
        <div class="logo-icon">ST</div>
        <div>
          <div class="logo-title">SmartTask</div>
          <div class="logo-subtitle">Task Management & Productivity REST API</div>
        </div>
      </div>
      <div class="header-actions">
        <a href="/docs" target="_blank" class="btn btn-secondary">⚡ OpenAPI Docs</a>
        <button class="btn btn-primary" onclick="openCreateModal()">+ Create Task</button>
      </div>
    </div>
  </header>

  <!-- Main Dashboard Content -->
  <div class="main-container">

    <!-- Overall Statistics Cards -->
    <div class="dashboard-grid">
      <div class="stat-card total">
        <div class="stat-header">
          <span>Total Tasks</span>
          <span>📋</span>
        </div>
        <div class="stat-value" id="stat-total">0</div>
      </div>

      <div class="stat-card completed">
        <div class="stat-header">
          <span>Completed</span>
          <span>✅</span>
        </div>
        <div class="stat-value" id="stat-completed">0</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="stat-rate-bar"></div>
        </div>
      </div>

      <div class="stat-card pending">
        <div class="stat-header">
          <span>Pending</span>
          <span>⏳</span>
        </div>
        <div class="stat-value" id="stat-pending">0</div>
      </div>

      <div class="stat-card in-progress">
        <div class="stat-header">
          <span>In Progress</span>
          <span>🚀</span>
        </div>
        <div class="stat-value" id="stat-in-progress">0</div>
      </div>
    </div>

    <!-- Category and Priority Summaries -->
    <div class="summary-row">
      <div class="summary-card">
        <h3>📌 Category Summary</h3>
        <div class="pill-group" id="category-pills">
          <div class="pill-item">Work <span class="pill-count" id="cat-work">0</span></div>
          <div class="pill-item">Study <span class="pill-count" id="cat-study">0</span></div>
          <div class="pill-item">Personal <span class="pill-count" id="cat-personal">0</span></div>
          <div class="pill-item">Project <span class="pill-count" id="cat-project">0</span></div>
        </div>
      </div>

      <div class="summary-card">
        <h3>🔥 Priority Summary</h3>
        <div class="pill-group" id="priority-pills">
          <div class="pill-item">High Priority <span class="pill-count" id="prio-high" style="color: var(--accent-danger);">0</span></div>
          <div class="pill-item">Medium Priority <span class="pill-count" id="prio-medium" style="color: var(--accent-warning);">0</span></div>
          <div class="pill-item">Low Priority <span class="pill-count" id="prio-low" style="color: var(--accent-info);">0</span></div>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs & Filtering Panel -->
    <div class="controls-panel">
      <div class="tabs-row">
        <button class="tab-btn active" id="tab-all" onclick="switchTab('all')">
          All Tasks
        </button>
        <button class="tab-btn" id="tab-today" onclick="switchTab('today')">
          📅 Due Today <span class="badge-count" id="badge-today">0</span>
        </button>
        <button class="tab-btn" id="tab-overdue" onclick="switchTab('overdue')">
          ⚠️ Overdue <span class="badge-count" id="badge-overdue">0</span>
        </button>
      </div>

      <div class="filters-row" id="filters-container">
        <div class="search-box">
          <input type="text" id="search-input" class="search-input" placeholder="🔍 Search tasks by title or description..." oninput="debounceSearch()" />
        </div>

        <select id="filter-status" class="filter-select" onchange="loadTasks()">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>

        <select id="filter-priority" class="filter-select" onchange="loadTasks()">
          <option value="">All Priorities</option>
          <option value="high">High Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="low">Low Priority</option>
        </select>

        <select id="filter-category" class="filter-select" onchange="loadTasks()">
          <option value="">All Categories</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
          <option value="Personal">Personal</option>
          <option value="Project">Project</option>
        </select>

        <button class="btn btn-secondary btn-sm" onclick="resetFilters()">Reset Filters</button>
      </div>
    </div>

    <!-- Tasks List Grid -->
    <div class="tasks-grid" id="tasks-grid">
      <!-- Loaded dynamically via JavaScript -->
    </div>

    <!-- Pagination Footer -->
    <div class="pagination-bar" id="pagination-bar">
      <div class="pagination-info" id="pagination-info">
        Showing 0 tasks
      </div>
      <div class="pagination-controls">
        <button class="btn btn-secondary btn-sm" id="btn-prev" onclick="changePage(-1)" disabled>Previous</button>
        <span id="page-indicator" style="font-size: 13px; font-weight: 600;">Page 1 of 1</span>
        <button class="btn btn-secondary btn-sm" id="btn-next" onclick="changePage(1)" disabled>Next</button>
      </div>
    </div>
  </div>

  <!-- Create/Edit Task Dialog Modal -->
  <dialog id="task-dialog">
    <div class="dialog-header">
      <h3 class="dialog-title" id="dialog-title">Create New Task</h3>
      <button class="dialog-close" onclick="closeModal()">&times;</button>
    </div>

    <div class="error-banner" id="modal-error"></div>

    <form id="task-form" onsubmit="handleFormSubmit(event)">
      <input type="hidden" id="task-id" />

      <div class="form-group">
        <label class="form-label">Task Title *</label>
        <input type="text" id="task-title" class="form-control" placeholder="e.g. Complete REST API unit tests" required />
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea id="task-desc" class="form-control" rows="3" placeholder="Optional details or subtasks..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select id="task-category" class="form-control" required>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
            <option value="Personal">Personal</option>
            <option value="Project">Project</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Priority *</label>
          <select id="task-priority" class="form-control" required>
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="task-status" class="form-control">
            <option value="pending">Pending</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Due Date</label>
          <input type="date" id="task-due-date" class="form-control" />
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="btn-submit">Save Task</button>
      </div>
    </form>
  </dialog>

  <!-- Client JavaScript -->
  <script>
    let currentTab = 'all';
    let currentPage = 1;
    let totalPages = 1;
    let searchTimeout = null;

    document.addEventListener('DOMContentLoaded', () => {
      refreshDashboard();
      loadTasks();
    });

    // Refresh Dashboard Stats
    async function refreshDashboard() {
      try {
        const [statsRes, prioRes, catRes, todayRes, overdueRes] = await Promise.all([
          fetch('/dashboard/stats'),
          fetch('/dashboard/priority-summary'),
          fetch('/dashboard/category-summary'),
          fetch('/tasks/today'),
          fetch('/tasks/overdue')
        ]);

        if (statsRes.ok) {
          const stats = await statsRes.json();
          document.getElementById('stat-total').innerText = stats.total_tasks;
          document.getElementById('stat-completed').innerText = stats.completed_tasks;
          document.getElementById('stat-pending').innerText = stats.pending_tasks;
          document.getElementById('stat-in-progress').innerText = stats.in_progress_tasks;
          document.getElementById('stat-rate-bar').style.width = `${stats.completion_rate}%`;
        }

        if (prioRes.ok) {
          const prio = await prioRes.json();
          document.getElementById('prio-high').innerText = prio.high;
          document.getElementById('prio-medium').innerText = prio.medium;
          document.getElementById('prio-low').innerText = prio.low;
        }

        if (catRes.ok) {
          const cat = await catRes.json();
          document.getElementById('cat-work').innerText = cat.Work;
          document.getElementById('cat-study').innerText = cat.Study;
          document.getElementById('cat-personal').innerText = cat.Personal;
          document.getElementById('cat-project').innerText = cat.Project;
        }

        if (todayRes.ok) {
          const todayTasks = await todayRes.json();
          document.getElementById('badge-today').innerText = todayTasks.length;
        }

        if (overdueRes.ok) {
          const overdueTasks = await overdueRes.json();
          document.getElementById('badge-overdue').innerText = overdueTasks.length;
        }
      } catch (err) {
        console.error('Failed to fetch dashboard metrics', err);
      }
    }

    // Switch View Tabs
    function switchTab(tab) {
      currentTab = tab;
      currentPage = 1;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');

      const filtersRow = document.getElementById('filters-container');
      const paginationBar = document.getElementById('pagination-bar');

      if (tab === 'all') {
        filtersRow.style.display = 'flex';
        paginationBar.style.display = 'flex';
      } else {
        filtersRow.style.display = 'none';
        paginationBar.style.display = 'none';
      }

      loadTasks();
    }

    // Debounce Search
    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentPage = 1;
        loadTasks();
      }, 300);
    }

    // Reset Filters
    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('filter-status').value = '';
      document.getElementById('filter-priority').value = '';
      document.getElementById('filter-category').value = '';
      currentPage = 1;
      loadTasks();
    }

    // Load Tasks according to active tab and filters
    async function loadTasks() {
      const grid = document.getElementById('tasks-grid');
      grid.innerHTML = '<div class="empty-state">Fetching tasks...</div>';

      try {
        let url = '';
        if (currentTab === 'today') {
          url = '/tasks/today';
        } else if (currentTab === 'overdue') {
          url = '/tasks/overdue';
        } else {
          const search = document.getElementById('search-input').value.trim();
          const status = document.getElementById('filter-status').value;
          const priority = document.getElementById('filter-priority').value;
          const category = document.getElementById('filter-category').value;

          const params = new URLSearchParams({
            page: currentPage,
            limit: 6
          });
          if (search) params.append('search', search);
          if (status) params.append('status', status);
          if (priority) params.append('priority', priority);
          if (category) params.append('category', category);

          url = `/tasks?${params.toString()}`;
        }

        const res = await fetch(url);
        if (!res.ok) throw new Error('Failed to load tasks');

        let tasks = [];
        if (currentTab === 'all') {
          const data = await res.json();
          tasks = data.tasks;
          totalPages = data.total_pages;
          updatePagination(data.total, data.page, data.total_pages);
        } else {
          tasks = await res.json();
        }

        renderTasks(tasks);
      } catch (err) {
        grid.innerHTML = `<div class="empty-state">Failed to load tasks. Check API connection.</div>`;
      }
    }

    // Render Task Cards
    function renderTasks(tasks) {
      const grid = document.getElementById('tasks-grid');
      if (tasks.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h4>No tasks found</h4>
            <p>Create a task or change filter criteria.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = tasks.map(task => {
        const isCompleted = task.status === 'completed';
        const formattedDate = task.due_date ? new Date(task.due_date).toLocaleDateString() : 'No due date';
        
        let dueClass = '';
        if (task.due_date && !isCompleted) {
          const today = new Date().toISOString().split('T')[0];
          if (task.due_date < today) dueClass = 'overdue';
        }

        return `
          <div class="task-card">
            <div>
              <div class="task-header">
                <div class="task-title ${isCompleted ? 'completed' : ''}">${escapeHtml(task.title)}</div>
              </div>
              <div class="task-meta-tags">
                <span class="tag tag-priority-${task.priority}">${task.priority}</span>
                <span class="tag tag-category">${task.category}</span>
                <span class="tag tag-status-${task.status}">${task.status.replace('_', ' ')}</span>
              </div>
              ${task.description ? `<p class="task-description" style="margin-top: 10px;">${escapeHtml(task.description)}</p>` : ''}
            </div>

            <div class="task-footer">
              <div class="task-due ${dueClass}">
                <span>📅 ${formattedDate}</span>
              </div>
              <div class="task-actions">
                ${!isCompleted ? `<button class="btn btn-secondary btn-sm" onclick="completeTask(${task.id})">✓ Complete</button>` : ''}
                <button class="btn btn-secondary btn-sm" onclick="openEditModal(${JSON.stringify(task).replace(/"/g, '&quot;')})">✏️ Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteTask(${task.id})">🗑️</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Pagination controls
    function updatePagination(total, page, pages) {
      document.getElementById('pagination-info').innerText = `Total ${total} task(s)`;
      document.getElementById('page-indicator').innerText = `Page ${page} of ${pages || 1}`;
      document.getElementById('btn-prev').disabled = page <= 1;
      document.getElementById('btn-next').disabled = page >= pages || pages === 0;
    }

    function changePage(delta) {
      currentPage += delta;
      loadTasks();
    }

    // Complete Task Action
    async function completeTask(taskId) {
      try {
        const res = await fetch(`/tasks/${taskId}/complete`, { method: 'PATCH' });
        if (res.ok) {
          refreshDashboard();
          loadTasks();
        }
      } catch (err) {
        alert('Failed to mark task as completed');
      }
    }

    // Delete Task Action
    async function deleteTask(taskId) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      try {
        const res = await fetch(`/tasks/${taskId}`, { method: 'DELETE' });
        if (res.status === 204) {
          refreshDashboard();
          loadTasks();
        }
      } catch (err) {
        alert('Failed to delete task');
      }
    }

    // Open Modal for Create
    function openCreateModal() {
      document.getElementById('dialog-title').innerText = 'Create New Task';
      document.getElementById('task-id').value = '';
      document.getElementById('task-title').value = '';
      document.getElementById('task-desc').value = '';
      document.getElementById('task-category').value = 'Work';
      document.getElementById('task-priority').value = 'medium';
      document.getElementById('task-status').value = 'pending';
      document.getElementById('task-due-date').value = '';
      document.getElementById('modal-error').style.display = 'none';

      document.getElementById('task-dialog').showModal();
    }

    // Open Modal for Edit
    function openEditModal(task) {
      document.getElementById('dialog-title').innerText = 'Edit Task';
      document.getElementById('task-id').value = task.id;
      document.getElementById('task-title').value = task.title;
      document.getElementById('task-desc').value = task.description || '';
      document.getElementById('task-category').value = task.category;
      document.getElementById('task-priority').value = task.priority;
      document.getElementById('task-status').value = task.status;
      document.getElementById('task-due-date').value = task.due_date || '';
      document.getElementById('modal-error').style.display = 'none';

      document.getElementById('task-dialog').showModal();
    }

    // Close Dialog Modal
    function closeModal() {
      document.getElementById('task-dialog').close();
    }

    // Handle Form Submission (Create or Edit)
    async function handleFormSubmit(e) {
      e.preventDefault();
      const taskId = document.getElementById('task-id').value;
      const title = document.getElementById('task-title').value.trim();
      const description = document.getElementById('task-desc').value.trim() || null;
      const category = document.getElementById('task-category').value;
      const priority = document.getElementById('task-priority').value;
      const status = document.getElementById('task-status').value;
      const due_date = document.getElementById('task-due-date').value || null;

      const payload = { title, description, category, priority, status, due_date };

      const errorBanner = document.getElementById('modal-error');
      errorBanner.style.display = 'none';

      try {
        let res;
        if (taskId) {
          res = await fetch(`/tasks/${taskId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } else {
          res = await fetch('/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        const data = await res.json();

        if (!res.ok) {
          errorBanner.innerText = data.error || 'Validation error occurred';
          errorBanner.style.display = 'block';
          return;
        }

        closeModal();
        refreshDashboard();
        loadTasks();
      } catch (err) {
        errorBanner.innerText = 'Network error occurred while saving task.';
        errorBanner.style.display = 'block';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
